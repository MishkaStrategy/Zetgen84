name: Proposal build and visual QA

on:
  push:
    branches: [main]
    paths:
      - 'proposal/**'
      - '.github/workflows/proposal-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

concurrency:
  group: proposal-qa
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build and validate proposal
        run: python proposal/build.py

      - name: Render presentation QA
        shell: bash
        run: |
          mkdir -p _qa
          python -m http.server 4173 --directory _site >/tmp/proposal-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1

          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium browser found on runner" >&2
            exit 1
          fi

          capture() {
            local name="$1"
            local size="$2"
            local anchor="$3"
            "$browser" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --virtual-time-budget=1600 --window-size="$size" \
              --screenshot="$PWD/_qa/${name}.png" \
              "http://127.0.0.1:4173/?qa=1${anchor}"
            test -s "_qa/${name}.png"
          }

          capture desktop-01-hero       1440,1000 ''
          capture desktop-02-situation  1440,1000 '#situation'
          capture desktop-03-system     1440,1000 '#system'
          capture desktop-04-strategy   1440,1000 '#build'
          capture desktop-05-roadmap    1440,1000 '#roadmap'
          capture desktop-06-investment 1440,1000 '#investment'
          capture desktop-07-impact     1440,1000 '#impact'
          capture desktop-08-final      1440,1000 '#final'
          capture mobile-01-hero        390,844 ''
          capture mobile-02-strategy    390,844 '#build'
          capture mobile-03-investment  390,844 '#investment'
          capture mobile-04-final       390,844 '#final'

          file _qa/*.png

      - name: Upload QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: zetgen84-proposal
          path: |
            _site
            _qa
          if-no-files-found: error
          retention-days: 1
