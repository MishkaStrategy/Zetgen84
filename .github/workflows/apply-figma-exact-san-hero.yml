name: Apply exact Figma San Valero and Hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-figma-exact-san-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch main
        run: python tools/apply_figma_exact.py

      - name: Validate and publish main
        shell: bash
        run: |
          set -euo pipefail
          node --check final/app.js
          test -s final/assets/figma-exact/san-valero-poster.png
          test -s final/assets/figma-exact/hero-product.png
          grep -q 'hero-product-exact' final/index.html
          grep -q 'san-valero-poster.png' final/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add final/index.html final/app.js final/styles.css final/mobile.css
          git commit -m 'Match San Valero and hero to Figma exactly'
          git push origin main

      - name: Publish same files to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/figma-exact-site
          cp final/index.html /tmp/figma-exact-site/index.html
          cp final/app.js /tmp/figma-exact-site/app.js
          cp final/styles.css /tmp/figma-exact-site/styles.css
          cp final/mobile.css /tmp/figma-exact-site/mobile.css
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp /tmp/figma-exact-site/index.html final/index.html
          cp /tmp/figma-exact-site/app.js final/app.js
          cp /tmp/figma-exact-site/styles.css final/styles.css
          cp /tmp/figma-exact-site/mobile.css final/mobile.css
          node --check final/app.js
          test -s final/assets/figma-exact/san-valero-poster.png
          test -s final/assets/figma-exact/hero-product.png
          git add final/index.html final/app.js final/styles.css final/mobile.css
          git commit -m 'Publish exact Figma San Valero and hero layout'
          git push origin gh-pages
