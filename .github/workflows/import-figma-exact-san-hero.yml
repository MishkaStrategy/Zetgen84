name: Import exact Figma San Valero and Hero

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-figma-exact-san-hero.yml'

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download exact Figma exports to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final/assets/figma-exact
          curl -fL --retry 3 'https://www.figma.com/api/mcp/asset/f062f736-902f-4b1d-bb4d-73679a4d2c04.png' -o final/assets/figma-exact/san-valero-poster.png
          curl -fL --retry 3 'https://www.figma.com/api/mcp/asset/cd455657-35d9-4aaa-8df6-07ed560c68f5.png' -o final/assets/figma-exact/hero-product.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add final/assets/figma-exact
          if ! git diff --cached --quiet; then
            git commit -m 'Import exact Figma San Valero and hero exports'
            git push origin main
          fi
      - name: Download exact Figma exports to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          mkdir -p final/assets/figma-exact
          curl -fL --retry 3 'https://www.figma.com/api/mcp/asset/f062f736-902f-4b1d-bb4d-73679a4d2c04.png' -o final/assets/figma-exact/san-valero-poster.png
          curl -fL --retry 3 'https://www.figma.com/api/mcp/asset/cd455657-35d9-4aaa-8df6-07ed560c68f5.png' -o final/assets/figma-exact/hero-product.png
          git add final/assets/figma-exact
          if ! git diff --cached --quiet; then
            git commit -m 'Publish exact Figma San Valero and hero exports'
            git push origin gh-pages
          fi
