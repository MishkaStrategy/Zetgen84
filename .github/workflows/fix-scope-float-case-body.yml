name: Fix scope float and case body typography

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-scope-float-case-body.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final CSS overrides
        shell: bash
        run: |
          set -euo pipefail
          cat >> final/styles.css <<'CSS'

/* 2026-08-17 — final scope hover + exact San Valero body typography parity */
.case-card:nth-child(2) .case-copy > p,
.case-card:nth-child(3) .case-copy > p{
  font-family:"Inter",Arial,sans-serif;
  font-size:16px;
  line-height:1.45;
  font-weight:400;
  letter-spacing:normal;
  color:#3e453b;
}

@keyframes scope-row-float-v2{
  0%,100%{translate:0 -4px}
  50%{translate:0 -12px}
}

@media (hover:hover) and (pointer:fine){
  .scope-row{
    transition:translate .38s cubic-bezier(.2,.75,.2,1),filter .38s ease;
  }
  .scope-row:hover{
    z-index:4;
    animation:scope-row-float-v2 1.85s ease-in-out infinite;
    filter:drop-shadow(0 18px 28px rgba(0,0,0,.16));
  }
  .scope-row:hover::before{
    opacity:1;
    transform:scale(1.008);
    background:linear-gradient(105deg,rgba(255,255,255,.09),rgba(255,255,255,.025));
    box-shadow:0 26px 64px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.1);
  }
}

@media (max-width:820px){
  .case-card:nth-child(2) .case-copy > p,
  .case-card:nth-child(3) .case-copy > p{
    font-family:"Inter",Arial,sans-serif;
    font-size:16px;
    line-height:1.45;
    font-weight:400;
    letter-spacing:normal;
    color:#3e453b;
  }
}
CSS

          python - <<'PY'
          from pathlib import Path
          p=Path('final/index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('styles.css?v=20260817-3','styles.css?v=20260817-4')
          p.write_text(s,encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add final/styles.css final/index.html
          git commit -m 'Strengthen scope float and match case body typography'
          git push origin main

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cp final/styles.css /tmp/final-styles.css
          cp final/index.html /tmp/final-index.html
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp /tmp/final-styles.css final/styles.css
          cp /tmp/final-index.html final/index.html
          git add final/styles.css final/index.html
          git commit -m 'Publish stronger scope float and case body typography'
          git push origin gh-pages
