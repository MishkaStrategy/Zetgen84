name: Fix scope float and case body typography

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-scope-float-case-body.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply final CSS overrides
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'final scope hover + exact San Valero body typography parity' final/styles.css || cat tools/final_case_scope_patch.css >> final/styles.css
          python -c "from pathlib import Path; p=Path('final/index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('styles.css?v=20260817-3','styles.css?v=20260817-4'); p.write_text(s,encoding='utf-8')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add final/styles.css final/index.html
          git commit -m 'Strengthen scope float and match case body typography'
          git push origin main

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cp final/styles.css /tmp/final-styles.css
          cp final/index.html /tmp/final-index.html
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp /tmp/final-styles.css final/styles.css
          cp /tmp/final-index.html final/index.html
          git add final/styles.css final/index.html
          git commit -m 'Publish stronger scope float and case body typography'
          git push origin gh-pages
