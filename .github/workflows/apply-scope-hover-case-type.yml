name: Apply scope hover and case typography

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-scope-hover-case-type.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply style updates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Scope floating hover + unified case typography' final/styles.css || cat tools/scope_hover_patch.css >> final/styles.css
          python -c "from pathlib import Path; p=Path('final/index.html'); s=p.read_text(encoding='utf-8'); s=s.replace('href=\"styles.css\"','href=\"styles.css?v=20260817-3\"',1); p.write_text(s,encoding='utf-8')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add final/styles.css final/index.html
          git commit -m 'Add floating scope hover and unify case typography'
          git push origin main

      - name: Publish to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          cp final/styles.css /tmp/final-styles.css
          cp final/index.html /tmp/final-index.html
          git fetch origin gh-pages
          git checkout -B gh-pages origin/gh-pages
          cp /tmp/final-styles.css final/styles.css
          cp /tmp/final-index.html final/index.html
          git add final/styles.css final/index.html
          git commit -m 'Publish scope hover and case typography'
          git push origin gh-pages
